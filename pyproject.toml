[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bibliography-io"
version = "0.1.0"
description = "Loading and writing bibliographic records across formats"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "pandas>=2.2,<3",
    "openpyxl>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bibliography_io"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
